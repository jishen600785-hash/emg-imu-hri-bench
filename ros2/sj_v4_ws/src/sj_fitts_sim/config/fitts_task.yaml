fitts_task:
  ros__parameters:
    subject_id: 1
    base_frame: base_link
    ee_frame: tool0
    # Same short multidirectional protocol used by the Limb Position platform:
    # 3 amplitudes * 2 target widths * 7 movements = 42 formal trials.
    distances_m: [0.08, 0.18, 0.28]
    widths_m: [0.025, 0.060]
    target_count: 7
    sequences_per_condition: 1
    practice_enabled: true
    practice_distance_m: 0.18
    practice_width_m: 0.060
    randomize_conditions: true
    random_seed: 42
    trial_timeout_sec: 35.0
    homing_timeout_sec: 35.0
    rest_confirmation_predictions: 2
    # The Extra Trees output has five classes, so an argmax confidence is at
    # least 0.20. Apply every causally smoothed movement prediction and keep a
    # separate, slightly stricter gate for two-window Rest confirmation.
    movement_confidence_threshold: 0.20
    selection_confidence_threshold: 0.30
    # V4: both trigger radii retain a safety margin inside the target.
    # W=25 mm -> 11.5 mm; W=60 mm -> 27 mm.
    autopilot_stop_radius_m: 0.0115
    width_stop_fraction: 0.45
    max_stop_radius_m: 0.027
    # Keep the current X/Y direction until its own axis error is within half
    # the stop radius. This avoids resetting the classifier history on every
    # small X/Y dominance change near the target.
    axis_hysteresis_fraction: 0.50
    # V4 coarse-to-fine control: move faster over long distances and slow
    # down near the target. A requested Rest publishes speed scale 0.
    speed_near_threshold_m: 0.05
    speed_far_threshold_m: 0.12
    speed_scale_near: 0.70
    speed_scale_mid: 1.00
    speed_scale_far: 1.35
    inter_trial_pause_sec: 0.50
    base_world_z: 0.72
    workspace_radius_m: 0.34

gesture_servo:
  ros__parameters:
    base_frame: base_link
    ee_frame: tool0
    linear_speed_mps: 0.120
    control_rate_hz: 30.0
    confidence_threshold: 0.20
    stable_predictions: 1
    prediction_timeout_sec: 1.2
    workspace_x: [-0.85, 0.85]
    workspace_y: [-0.85, 0.85]

sj_emg_replay:
  ros__parameters:
    subject_id: 1
    condition: dynamic
    publish_period_sec: 0.25
    random_seed: 42

sj_gesture_classifier:
  ros__parameters:
    subject_id: 1
    expected_condition: dynamic

fitts_video_recorder:
  ros__parameters:
    fps: 30.0
    post_roll_sec: 2.0
    camera_topic: /fitts/camera/image
